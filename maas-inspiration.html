<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Maas Inspiration</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202c;--mut:#5b6977;--line:#e3e8ee;--acc:#0f766e;--red:#dc2626;--redb:#fef2f2;--amb:#b45309;--ambb:#fffbeb;--blu:#1d4ed8;--blub:#eff6ff;--grn:#047857;--grnb:#ecfdf5;--pur:#7c2d12;--purb:#fff7ed}
*{box-sizing:border-box}body{margin:0;font:17px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}
.top{padding-top:max(22px,env(safe-area-inset-top));background:linear-gradient(135deg,#0f766e,#134e4a 60%,#1e3a5f);color:#fff;padding:22px 0 0;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.top .wrap{padding-bottom:0}.brand{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px}
.brand h1{margin:0;font-size:1.55rem;letter-spacing:.08em}.brand .meta{opacity:.9;font-size:.95rem;text-align:right}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}nav button{background:none;border:0;color:#d9f2ee;font:600 .95rem inherit;font-family:inherit;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-color:#5eead4}
h2.day{font-size:1.35rem;margin:24px 0 4px}.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.hist{background:var(--ambb);border:1px solid #fcd34d;color:var(--amb);padding:10px 14px;border-radius:10px;margin:12px 0;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;border-width:2px;transition:.15s}button.stat:hover{border-color:var(--acc);transform:translateY(-1px)}button.stat.on{border-color:var(--acc);background:#f0fdfa;box-shadow:0 0 0 3px #99f6e4}button.stat span:after{content:" ›";font-weight:700}.focus{border:2px solid var(--acc)}.stat b{font-size:1.6rem;display:block}.stat span{color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.08rem}
.card>summary::-webkit-details-marker{display:none}.card>summary:after{content:"▾";color:var(--mut);transition:.2s}.card:not([open])>summary:after{transform:rotate(-90deg)}
.card .in{padding:0 18px 16px}.card.glance{border:2px solid var(--acc)}
.chip{display:inline-block;font:700 .72rem/1 inherit;font-family:inherit;letter-spacing:.05em;padding:5px 8px;border-radius:6px;margin-right:8px;vertical-align:2px;white-space:nowrap}
.URGENT{background:var(--redb);color:var(--red)}.OVERDUE{background:var(--red);color:#fff}.TODAY{background:var(--blub);color:var(--blu)}.WAITING{background:var(--ambb);color:var(--amb)}.COMPLETED{background:var(--grnb);color:var(--grn)}.WEEK,.THIS{background:var(--purb);color:var(--pur)}
ul.clean{list-style:none;margin:0;padding:0}ul.clean li{padding:9px 0;border-top:1px solid var(--line)}ul.clean li:first-child{border-top:0}
table{width:100%;border-collapse:collapse;font-size:.95rem}th{text-align:left;color:var(--mut);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:2px solid var(--line)}td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 0 6px}
.task{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}.task input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc);flex:none}
.task.done .tt{text-decoration:line-through;color:var(--mut)}.tt{font-weight:600}.tm{color:var(--mut);font-size:.88rem}
.carry{font-size:.75rem;color:var(--acc);font-weight:700}
.dbtn{flex:none;min-width:96px;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;font:700 .85rem inherit;font-family:inherit;color:var(--mut);cursor:pointer}.dbtn:hover{border-color:var(--grn);color:var(--grn)}.dbtn.on{background:var(--grn);border-color:var(--grn);color:#fff}
.tact{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}.btn.warn{color:var(--red);border-color:var(--red)}.rep{margin-top:8px}.rep textarea{min-height:70px}.myrep{margin-top:6px;background:var(--blub);color:var(--blu);border-radius:8px;padding:6px 10px;font-size:.9rem;white-space:pre-wrap}.task>div{flex:1}
.proj{border:1px solid var(--line);border-radius:10px;margin:8px 0}.proj>summary{padding:12px 14px;cursor:pointer;font-weight:600}.proj .pi{padding:0 14px 12px;font-size:.95rem}
.pi dt{font-weight:700;color:var(--mut);font-size:.8rem;text-transform:uppercase;margin-top:8px}.pi dd{margin:2px 0 0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:600 .88rem inherit;font-family:inherit;cursor:pointer}.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}.btn.sm{padding:4px 8px;font-size:.78rem}
.em{padding:10px 0;border-top:1px solid var(--line)}.em summary{cursor:pointer}.em .d{color:var(--mut);font-size:.92rem;margin:6px 0 0 4px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.95rem;resize:vertical}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.notes label{font-weight:700;font-size:.9rem;display:block;margin-bottom:4px}
pre.md{white-space:pre-wrap;font:inherit;font-size:.93rem;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:62px;padding:6px;font-size:.9rem}.cal .h{background:none;border:0;min-height:0;text-align:center;color:var(--mut);font-weight:700;font-size:.8rem}
.cal .has{border-color:var(--acc);cursor:pointer;background:#f0fdfa}.cal .has small{display:block;color:var(--acc);font-weight:600}.cal .sel{outline:3px solid var(--acc)}
.search input{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:1.05rem}.hit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.hit mark{background:#fde68a}
#lock{max-width:380px;margin:18vh auto;text-align:center}#lock input{width:100%;padding:14px;font-size:1.1rem;border-radius:10px;border:1px solid var(--line);margin:14px 0}
.empty{color:var(--mut);font-style:italic}
.syncst{font-size:.78rem;opacity:.8}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0 20px}
.pad a{display:flex;flex-direction:column;gap:6px;min-height:118px;padding:14px;border-radius:18px;background:var(--card);border:2px solid var(--line);color:var(--ink);text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:.12s}
.pad a:hover{border-color:var(--acc)}.pad a:active{transform:scale(.97);background:#f0fdfa}
.pad .r1{display:flex;justify-content:space-between;align-items:center}.pad .no{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.pad .ic{font-size:1.8rem;line-height:1}.pad .lb{font-weight:700;font-size:1.02rem;line-height:1.25;flex:1}
.pad .ct{align-self:flex-start;font-weight:800;font-size:.9rem;padding:4px 10px;border-radius:999px;background:var(--grnb);color:var(--grn)}.pad .ct.red{background:var(--redb);color:var(--red)}.pad .ct.zero{background:#f1f5f9;color:var(--mut)}
.secbar{display:flex;gap:10px;margin:14px 0}.secbar a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:58px;padding:10px;border-radius:14px;font-weight:700;font-size:1.02rem;text-decoration:none;background:var(--card);color:var(--acc);border:2px solid var(--acc)}.secbar a.all{background:var(--acc);color:#fff}
.sectitle{font-size:.9rem;color:var(--mut);text-align:center;margin:-4px 0 10px}
.fab{position:fixed;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:6;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:15px 20px;font:700 1rem inherit;font-family:inherit;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
body{padding-bottom:80px}nav button{padding:12px 16px;font-size:1rem}.btn{padding:11px 16px;font-size:.95rem;border-radius:10px}.btn.sm{padding:9px 13px;font-size:.88rem}.dbtn{min-height:46px;min-width:110px;font-size:.95rem}.card>summary{padding:18px 20px;font-size:1.15rem}
@media(max-width:640px){.pad{grid-template-columns:1fr 1fr;gap:10px}.pad a{min-height:110px}.secbar a{font-size:.95rem}}
@media(max-width:640px){body{font-size:16px}.brand h1{font-size:1.25rem}.brand .meta{text-align:left}table.resp thead{display:none}table.resp tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}table.resp td{display:block;border:0;padding:2px 0}table.resp td:before{content:attr(data-l)": ";color:var(--mut);font-size:.8rem}}
@media print{.top{position:static}nav{display:none}}

.notes input:not([type]),.notes select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.stsel{font:inherit;font-size:.85rem;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.stsel+.chip{display:none}td .dbtn{min-width:70px;min-height:38px}
@media(max-width:640px){.stsel+.chip{display:none}}

<script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SEED,CFG={
food:{t:'1. Food',p:'Show volunteers what kind of food is being planned and served.',src:'Source (later): Google Drive › Maas Inspiration folder. Not connected in this demo.',
 f:[['dish','Dish','text'],['date','Date','text'],['time','Time','text'],['qty','Qty','text'],['notes','Dietary notes','text'],['prep','Prep / cook','text'],['status','Status','status']],st:['Planned','In progress','Served'],name:'dish'},
volunteer:{t:'2. Volunteer',p:'Manage volunteer sign-ups, roles, and contact info.',
 f:[['name','Name','text'],['contact','Phone / email','text'],['role','Role','text'],['avail','Availability','text'],['section','Section','sel',['Food','Scheduling','Delivery']],['status','Status','status'],['checkin','Checked in','toggle']],st:['Pending','Confirmed','Inactive'],name:'name'},
scheduling:{t:'3. Scheduling',p:'Plan when things happen: meal service times, volunteer shifts, and events.',
 f:[['event','Event / shift','text'],['date','Date','text'],['time','Time','text'],['loc','Location','text'],['vols','Volunteers','vols'],['food','Food','foodsel'],['notes','Notes','text'],['status','Status','status']],st:['Planned','Done','Cancelled'],name:'event'},
delivery:{t:'4. Delivery',p:'Track food deliveries: where food goes, who delivers it, and status.',
 f:[['dest','Destination','text'],['date','Date','text'],['time','Time','text'],['driver','Driver','drvsel'],['items','Items','text'],['qty','Qty','text'],['status','Status','status'],['conf','Confirmed','toggle']],st:['Pending','In transit','Delivered'],name:'dest'}};
const CH={Planned:'TODAY',Pending:'WAITING','In progress':'WAITING','In transit':'TODAY',Served:'COMPLETED',Delivered:'COMPLETED',Confirmed:'COMPLETED',Done:'COMPLETED',Cancelled:'URGENT',Inactive:'URGENT'};
const K=s=>'maas_'+s,get=s=>{try{const v=JSON.parse(localStorage.getItem(K(s)));if(Array.isArray(v))return v}catch(e){}const v=JSON.parse(JSON.stringify(SEED[s]));put(s,v);return v},put=(s,v)=>localStorage.setItem(K(s),JSON.stringify(v));

function cell(s,r,[k,l,t]){const v=r[k];
 if(t==='status')return `<select class="stsel" data-id="${r.id}">${CFG[s].st.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select> <span class="chip ${CH[v]||''}">${esc((v||'').toUpperCase())}</span>`;
 if(t==='toggle')return `<button class="dbtn tog ${v?'on':''}" data-id="${r.id}" data-k="${k}">${v?'✓ Yes':'No'}</button>`;
 if(t==='vols')return esc((v||[]).join(', '))||'—';return esc(v)||'—'}
function render(){const s=cur,c=CFG[s],rows=get(s);
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===s));
 const counts=c.st.map(o=>[o,rows.filter(r=>r.status===o).length]);const tg=c.f.find(f=>f[2]==='toggle');
 const q=filt.q.toLowerCase(),list=rows.filter(r=>(!filt.st||r.status===filt.st)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));
 $('#main').innerHTML=`<h2 class="day">${c.t}</h2><p class="sub"><b>Purpose:</b> ${c.p}${c.src?'<br>'+c.src:''}</p>
 <div class="grid"><button class="stat ${!filt.st?'on':''}" data-st=""><b>${rows.length}</b><span>All</span></button>${counts.map(([o,n])=>`<button class="stat ${filt.st===o?'on':''}" data-st="${o}"><b>${n}</b><span>${o}</span></button>`).join('')}${tg?`<div class="stat"><b>${rows.filter(r=>r[tg[0]]).length}</b><span>${tg[1]}</span></div>`:''}</div>
 <div class="search" style="display:flex;gap:8px;margin-bottom:12px"><input id="q" placeholder="Search ${c.t.slice(3)}…" value="${esc(filt.q)}"><button class="btn" id="add">+ Add</button></div>
 <div id="form"></div>
 <div class="card"><div class="in" style="padding-top:12px">${list.length?`<table class="resp"><thead><tr>${c.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${list.map(r=>`<tr>${c.f.map(f=>`<td data-l="${f[1]}">${cell(s,r,f)}</td>`).join('')}<td data-l="Actions"><button class="btn sm ghost ed" data-id="${r.id}">Edit</button> <button class="btn sm ghost warn del" data-id="${r.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:'<p class="empty">No entries match.</p>'}
 <p style="margin-top:14px"><button class="btn sm ghost" id="reset">Reset to examples</button></p></div></div>`;
 $('#q').oninput=e=>{filt.q=e.target.value;const p=e.target.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)};
 document.querySelectorAll('.stat[data-st]').forEach(b=>b.onclick=()=>{filt.st=b.dataset.st;render()});
 $('#add').onclick=()=>form(null);
 document.querySelectorAll('.ed').forEach(b=>b.onclick=()=>form(b.dataset.id));
 document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id===b.dataset.id);if(confirm('Delete "'+(r[c.name]||'entry')+'"?')){put(s,rows.filter(x=>x.id!==b.dataset.id));render()}});
 document.querySelectorAll('.stsel').forEach(e=>e.onchange=()=>{rows.find(x=>x.id===e.dataset.id).status=e.value;put(s,rows);render()});
 document.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id===b.dataset.id);r[b.dataset.k]=!r[b.dataset.k];put(s,rows);render()});
 $('#reset').onclick=()=>{if(confirm('Replace all '+c.t.slice(3)+' entries with the example rows?')){localStorage.removeItem(K(s));render()}};
 if(editing!==null)form(editing)}
function form(id){const s=cur,c=CFG[s],rows=get(s),r=id?rows.find(x=>x.id===id):{status:c.st[0]};editing=id;
 const vols=get('volunteer').map(v=>v.name).filter(Boolean),foods=get('food').map(v=>v.dish).filter(Boolean);
 const inp=([k,l,t,o])=>{const v=r[k];let h;
  if(t==='status'||t==='sel'){o=t==='status'?c.st:o;h=`<select name="${k}">${o.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}</select>`}
  else if(t==='toggle')h=`<label><input type="checkbox" name="${k}"${v?' checked':''}> Yes</label>`;
  else if(t==='vols')h=vols.length?vols.map(n=>`<label style="display:block;font-weight:400"><input type="checkbox" name="vols" value="${esc(n)}"${(v||[]).includes(n)?' checked':''}> ${esc(n)}</label>`).join(''):'<p class="empty">Add volunteers first.</p>';
  else if(t==='foodsel'||t==='drvsel'){o=t==='foodsel'?foods:vols;if(v&&!o.includes(v))o=[v,...o];h=`<select name="${k}"><option value="">—</option>${o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select>`}
  else h=`<input name="${k}" value="${esc(v)}">`;return `<div><label>${l}</label>${h}</div>`};
 $('#form').innerHTML=`<div class="card focus"><div class="in" style="padding-top:16px"><h3 style="margin-top:0">${id?'Edit entry':'New entry'}</h3><form id="f" class="notes">${c.f.map(inp).join('')}</form><p class="tact"><button class="btn" id="save">Save</button><button class="btn ghost" id="cancel">Cancel</button></p></div></div>`;
 $('#cancel').onclick=()=>{editing=null;$('#form').innerHTML=''};
 $('#save').onclick=()=>{const F=$('#f'),o=id?r:{id:uid()};c.f.forEach(([k,l,t])=>{if(t==='toggle')o[k]=F.elements[k].checked;else if(t==='vols')o[k]=[...F.querySelectorAll('input[name=vols]:checked')].map(x=>x.value);else o[k]=F.elements[k].value.trim()});
  if(!o[c.name]){alert(c.f[0][1]+' is required.');return}if(!id)rows.push(o);put(s,rows);editing=null;render()}}
function boot(d){SEED=d.seed;$('#app').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.v});
 window.onhashchange=()=>{const h=location.hash.slice(1);cur=CFG[h]?h:'food';filt={q:'',st:''};editing=null;render()};window.onhashchange()}
async function unlock(pw){const e=P.enc,b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct))))}
const P=JSON.parse(document.getElementById('payload').textContent);
(async()=>{if(P.plain)return boot(P.plain);for(const st of[localStorage,sessionStorage]){const s=st.getItem('db_pw');if(s){try{return boot(await unlock(s))}catch(e){}}}
 $('#lock').hidden=false;const go=async()=>{try{const d=await unlock($('#pw').value);if($('#rem').checked)localStorage.setItem('db_pw',$('#pw').value);else sessionStorage.setItem('db_pw',$('#pw').value);$('#lock').hidden=true;boot(d)}catch(e){$('#err').textContent='That passcode did not work.'}};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}})();
</script></body></html>
