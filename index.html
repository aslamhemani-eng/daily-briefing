<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Daily Briefing</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Briefing"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202c;--mut:#5b6977;--line:#e3e8ee;--acc:#0f766e;--red:#dc2626;--redb:#fef2f2;--amb:#b45309;--ambb:#fffbeb;--blu:#1d4ed8;--blub:#eff6ff;--grn:#047857;--grnb:#ecfdf5;--pur:#7c2d12;--purb:#fff7ed}
*{box-sizing:border-box}body{margin:0;font:17px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}
.top{padding-top:max(22px,env(safe-area-inset-top));background:linear-gradient(135deg,#0f766e,#134e4a 60%,#1e3a5f);color:#fff;padding:22px 0 0;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.top .wrap{padding-bottom:0}.brand{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px}
.brand h1{margin:0;font-size:1.55rem;letter-spacing:.08em}.brand .meta{opacity:.9;font-size:.95rem;text-align:right}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}nav button{background:none;border:0;color:#d9f2ee;font:600 .95rem inherit;font-family:inherit;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-color:#5eead4}
h2.day{font-size:1.35rem;margin:24px 0 4px}.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.hist{background:var(--ambb);border:1px solid #fcd34d;color:var(--amb);padding:10px 14px;border-radius:10px;margin:12px 0;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;border-width:2px;transition:.15s}button.stat:hover{border-color:var(--acc);transform:translateY(-1px)}button.stat.on{border-color:var(--acc);background:#f0fdfa;box-shadow:0 0 0 3px #99f6e4}button.stat span:after{content:" ›";font-weight:700}.focus{border:2px solid var(--acc)}.stat b{font-size:1.6rem;display:block}.stat span{color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.08rem}
.card>summary::-webkit-details-marker{display:none}.card>summary:after{content:"▾";color:var(--mut);transition:.2s}.card:not([open])>summary:after{transform:rotate(-90deg)}
.card .in{padding:0 18px 16px}.card.glance{border:2px solid var(--acc)}
.chip{display:inline-block;font:700 .72rem/1 inherit;font-family:inherit;letter-spacing:.05em;padding:5px 8px;border-radius:6px;margin-right:8px;vertical-align:2px;white-space:nowrap}
.URGENT{background:var(--redb);color:var(--red)}.OVERDUE{background:var(--red);color:#fff}.TODAY{background:var(--blub);color:var(--blu)}.WAITING{background:var(--ambb);color:var(--amb)}.COMPLETED{background:var(--grnb);color:var(--grn)}.WEEK,.THIS{background:var(--purb);color:var(--pur)}
ul.clean{list-style:none;margin:0;padding:0}ul.clean li{padding:9px 0;border-top:1px solid var(--line)}ul.clean li:first-child{border-top:0}
table{width:100%;border-collapse:collapse;font-size:.95rem}th{text-align:left;color:var(--mut);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:2px solid var(--line)}td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 0 6px}
.task{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}.task input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc);flex:none}
.task.done .tt{text-decoration:line-through;color:var(--mut)}.tt{font-weight:600}.tm{color:var(--mut);font-size:.88rem}
.carry{font-size:.75rem;color:var(--acc);font-weight:700}
.dbtn{flex:none;min-width:96px;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;font:700 .85rem inherit;font-family:inherit;color:var(--mut);cursor:pointer}.dbtn:hover{border-color:var(--grn);color:var(--grn)}.dbtn.on{background:var(--grn);border-color:var(--grn);color:#fff}
.tact{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}.btn.warn{color:var(--red);border-color:var(--red)}.rep{margin-top:8px}.rep textarea{min-height:70px}.myrep{margin-top:6px;background:var(--blub);color:var(--blu);border-radius:8px;padding:6px 10px;font-size:.9rem;white-space:pre-wrap}.task>div{flex:1}
.proj{border:1px solid var(--line);border-radius:10px;margin:8px 0}.proj>summary{padding:12px 14px;cursor:pointer;font-weight:600}.proj .pi{padding:0 14px 12px;font-size:.95rem}
.pi dt{font-weight:700;color:var(--mut);font-size:.8rem;text-transform:uppercase;margin-top:8px}.pi dd{margin:2px 0 0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:600 .88rem inherit;font-family:inherit;cursor:pointer}.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}.btn.sm{padding:4px 8px;font-size:.78rem}
.em{padding:10px 0;border-top:1px solid var(--line)}.em summary{cursor:pointer}.em .d{color:var(--mut);font-size:.92rem;margin:6px 0 0 4px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.95rem;resize:vertical}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.notes label{font-weight:700;font-size:.9rem;display:block;margin-bottom:4px}
pre.md{white-space:pre-wrap;font:inherit;font-size:.93rem;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:62px;padding:6px;font-size:.9rem}.cal .h{background:none;border:0;min-height:0;text-align:center;color:var(--mut);font-weight:700;font-size:.8rem}
.cal .has{border-color:var(--acc);cursor:pointer;background:#f0fdfa}.cal .has small{display:block;color:var(--acc);font-weight:600}.cal .sel{outline:3px solid var(--acc)}
.search input{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:1.05rem}.hit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.hit mark{background:#fde68a}
#lock{max-width:380px;margin:18vh auto;text-align:center}#lock input{width:100%;padding:14px;font-size:1.1rem;border-radius:10px;border:1px solid var(--line);margin:14px 0}
.empty{color:var(--mut);font-style:italic}
@media(max-width:640px){body{font-size:16px}.brand h1{font-size:1.25rem}.brand .meta{text-align:left}table.resp thead{display:none}table.resp tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}table.resp td{display:block;border:0;padding:2px 0}table.resp td:before{content:attr(data-l)": ";color:var(--mut);font-size:.8rem}}
@media print{.top{position:static}nav{display:none}}
</style></head><body>

<script>
const P=JSON.parse(document.getElementById('payload').textContent);let DB,CFG;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('db_'+k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem('db_'+k,JSON.stringify(v))};
const nowCT=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'});
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const fmtW=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const chip=s=>{const c=(s||'').split(' ')[0];return s?`<span class="chip ${esc(c)}">${esc(s)}</span>`:''};
async function unlock(pw){const e=P.enc,b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function start(){if(P.plain){boot(P.plain);return}
 const saved=localStorage.getItem('db_pw');if(saved){try{boot(await unlock(saved));return}catch(e){localStorage.removeItem('db_pw')}}
 $('#lock').hidden=false;const go=async()=>{try{const d=await unlock($('#pw').value);if($('#rem').checked)localStorage.setItem('db_pw',$('#pw').value);else sessionStorage.setItem('db_pw',$('#pw').value);$('#lock').hidden=true;boot(d)}catch(e){$('#err').textContent='That passcode did not work.'}};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
let dates=[],focusF=null,keepScroll=false;
function boot(d){DB=d.days;CFG=d.config;dates=Object.keys(DB).sort();$('#app').hidden=false;
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.v});window.onhashchange=route;route()}
function latest(){const t=nowCT();return dates.filter(x=>x<=t).pop()||dates[dates.length-1]}
function route(){const h=location.hash.slice(1)||'today';let v=h;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(h.startsWith('day/')?'archive':h)));
 const L=latest();$('#today').textContent=fmtW(nowCT());$('#upd').textContent='Last updated '+new Date(DB[L].updated).toLocaleString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' CT';
 if(h==='today')return day(L);if(h==='yesterday'){const i=dates.indexOf(L);return i>0?day(dates[i-1]):($('#main').innerHTML='<h2 class="day">Yesterday</h2><p class="empty">There is no briefing before '+fmt(L)+' yet. The archive started on '+fmt(dates[0])+'.</p>')}
 if(h.startsWith('day/'))return day(h.slice(4));if(h==='calendar')return cal();if(h==='archive')return arch();if(h==='search')return search();day(L)}
function done(id){return LS.get('done',{})[id]}
function setDone(id,v,date){const m=LS.get('done',{});if(v)m[id]=date;else delete m[id];LS.set('done',m)}
function deleted(id){return LS.get('deleted',{})[id]}
function reply(id){return LS.get('replies',{})[id]}
function hk(x){let h=0;for(const c of String(x))h=(h*31+c.charCodeAt(0))|0;return (h>>>0).toString(36)}
function ctl(key,text,date){const dn=done(key),r=reply(key),id=esc(key),tk=esc(text);
 return {dn,btn:`<button class="dbtn ${dn?'on':''}" data-id="${id}" data-date="${date}" data-v="${dn?0:1}" title="${dn?'Mark not done':'Mark done'}">${dn?'✓ Done':'Mark done'}</button>`,
 rest:`${r?`<div class="myrep"><b>My response:</b> ${esc(r.text)}${r.sent?' <i>(emailed)</i>':''}</div>`:''}<div class="tact"><button class="btn ghost sm" data-trep="${id}">${r?'Edit response':'Respond'}</button><button class="btn ghost sm warn" data-tdel="${id}">Delete</button></div>
 <div class="rep" data-repbox="${id}" hidden><textarea data-reptext="${id}" placeholder="Type your response…">${esc(r?r.text:'')}</textarea><div class="tact"><button class="btn sm" data-tsave="${id}" data-task="${tk}" data-date="${date}">Save</button><button class="btn ghost sm" data-tsend="${id}" data-task="${tk}" data-date="${date}">Save &amp; email to my assistants</button><button class="btn ghost sm" data-tcancel="${id}">Cancel</button></div></div>`}}
function gKey(g,date){return 'g:'+date+':'+hk(g.t)}
function uKey(u){return 'u:'+hk(u.date+'|'+u.t)}
function sKey(x,date){return 's:'+date+':'+hk(x.time+'|'+x.title)}
function itemRow(key,text,inner,date){if(deleted(key))return '';const c=ctl(key,text,date);return `<div class="task ${c.dn?'done':''}">${c.btn}<div>${inner}${c.rest}</div></div>`}
function deleted(id){return LS.get('deleted',{})[id]}
function reply(id){return LS.get('replies',{})[id]}
function taskHtml(t,date,isToday){const dn=done(t.id);const carried=t.carried?`<span class="carry">CARRIED FORWARD</span> `:'';
 if(deleted(t.id))return '';if(dn&&dn<date)return '';const c=ctl(t.id,t.task,date);
 return `<div class="task ${dn?'done':''}">${c.btn}<div><div class="tt">${chip(dn?'COMPLETED':t.status)}${carried}${esc(t.task)}</div><div class="tm">${esc(t.project)} · ${esc(t.who)}${t.due?' · Due '+esc(t.due):''}</div>${t.notes?`<div class="tm">${esc(t.notes)}</div>`:''}${c.rest}</div></div>`}
function projects(D,isToday){let names=LS.get('projects',null)||CFG.projects;const P=D.projects||{};
 let h=names.map((n,i)=>{const p=P[n];const body=p?`<dl class="pi">${p.status?`<dt>Current status</dt><dd>${esc(p.status)}</dd>`:''}${[['Important updates','updates'],['Open items','open'],['Money','money'],['People to contact','contact']].map(([l,k])=>p[k]&&p[k].length?`<dt>${l}</dt><dd>${p[k].map(esc).join('<br>')}</dd>`:'').join('')}${p.next?`<dt>Next action</dt><dd>${esc(p.next)}</dd>`:''}${p.deadline?`<dt>Deadline</dt><dd>${esc(p.deadline)}</dd>`:''}</dl>`:'<div class="pi empty">Nothing needs your attention today.</div>';
  return `<details class="proj" ${p?'open':''}><summary>${p?'● ':'○ '}${esc(n)} ${isToday?`<span style="float:right"><button class="btn ghost sm" data-ren="${i}">Rename</button> <button class="btn ghost sm" data-del="${i}">Remove</button></span>`:''}</summary>${body}</details>`}).join('');
 if(isToday)h+=`<p><button class="btn ghost" id="addp">+ Add project</button></p>`;return h}
function eKey(e){return 'e:'+hk((e.from||'')+'|'+(e.subject||''))}
function emailGroup(title,arr,date,act){if(!arr||!arr.length)return '';arr=arr.filter(e=>!(act&&deleted(eKey(e))));if(!arr.length)return '';const left=act?arr.filter(e=>!done(eKey(e))).length:arr.length;
 const body=e=>`<details class="em" style="border:0;padding:0"><summary><b>${esc(e.from)}</b> · ${esc(e.subject)}</summary><div class="d">${esc(e.summary)}${e.need?`<br><b>They need:</b> ${esc(e.need)}`:''}${e.next?`<br><b>Next step:</b> ${esc(e.next)}`:''}</div></details>`;
 return `<h3>${title} (${left}${act&&left!==arr.length?' left of '+arr.length:''})</h3>`+arr.map(e=>act?itemRow(eKey(e),e.from+' — '+e.subject,(done(eKey(e))?chip('COMPLETED'):'')+body(e),date):`<div class="em">${body(e)}</div>`).join('')}
function finRows(label,arr){return (arr||[]).map(f=>`<tr><td data-l="Type">${label}</td><td data-l="Item">${esc(f.t)}</td><td data-l="When / amount">${esc(f.d)}</td><td data-l="Status">${chip(f.s)}</td></tr>`).join('')}
function carryIn(date){const i=dates.indexOf(date);if(i<1)return '';const prev=DB[dates[i-1]];return (LS.get('notes_'+dates[i-1],{}).tomorrow||'').trim()}
function day(date){const D=DB[date];if(!D){$('#main').innerHTML='<p class="empty">No briefing for that date.</p>';return}
 const isToday=date===latest();const T=D.tasks||{};const all=[...(T.urgent||[]),...(T.week||[]),...(T.waiting||[])];
 const open=all.filter(t=>!done(t.id)||done(t.id)>=date);const urg=open.filter(t=>['URGENT','OVERDUE'].includes(t.status)&&!done(t.id)).length;
 const notes=LS.get('notes_'+date,{});const fromY=carryIn(date);
 const keys=[...all.map(t=>t.id),...(D.glance||[]).map(g=>gKey(g,date)),...(D.schedule||[]).map(x=>sKey(x,date)),...(D.upcoming||[]).map(uKey),...(D.email?.reply||[]).map(eKey)];const nDel=keys.filter(k=>deleted(k)).length;
 let h=`<h2 class="day">Daily Briefing — ${fmt(date)}</h2><p class="sub">${fmtW(date)}</p>`;
 if(!isToday)h+=`<div class="hist">This is the saved record for ${fmt(date)}. It stays exactly as it was.</div>`;
 const openT=all.filter(t=>!deleted(t.id)&&!(done(t.id)&&done(t.id)<date));
 const TF={urgent:{label:'Urgent or overdue',n:urg,red:1,html:()=>openT.filter(t=>['URGENT','OVERDUE'].includes(t.status)&&!done(t.id)).map(t=>taskHtml(t,date)).join('')||'<p class="empty">Nothing urgent or overdue.</p>'},
  sched:{label:"Items on today's schedule",n:(D.schedule||[]).length,html:()=>(D.schedule||[]).map(x=>itemRow(sKey(x,date),x.time+' '+x.title,`<div class="tt">${chip(done(sKey(x,date))?'COMPLETED':'')}<b>${esc(x.time)}</b> · ${esc(x.title)}</div><div class="tm">${[x.location,x.people,x.purpose].filter(Boolean).map(esc).join(' · ')}</div>`,date)).join('')||'<p class="empty">Nothing scheduled today.</p>'},
  week:{label:'Important this week',n:(T.week||[]).filter(t=>!done(t.id)).length,html:()=>(T.week||[]).map(t=>taskHtml(t,date)).join('')||'<p class="empty">Nothing for this week.</p>'},
  wait:{label:'Waiting on others',n:(T.waiting||[]).length,html:()=>(T.waiting||[]).map(t=>taskHtml(t,date)).join('')||'<p class="empty">Not waiting on anyone.</p>'},
  email:{label:'Emails need your reply',n:(D.email?.reply||[]).filter(e=>!done(eKey(e))&&!deleted(eKey(e))).length,html:()=>emailGroup('Needs my reply',D.email?.reply,date,1)||'<p class="empty">No emails need a reply.</p>'}};
 if(focusF&&focusF.date!==date)focusF=null;
 h+=`<div class="grid">${Object.entries(TF).map(([k,f])=>`<button class="stat ${focusF&&focusF.k===k?'on':''}" data-f="${k}"><b ${f.red?'style="color:var(--red)"':''}>${f.n}</b><span>${f.label}</span></button>`).join('')}</div>`;
 if(focusF){const f=TF[focusF.k];h+=`<details class="card focus" open id="focus"><summary>${esc(f.label)} (${f.n}) <button class="btn ghost sm" id="fclose" style="margin-left:auto;margin-right:10px">Close</button></summary><div class="in">${f.html()}</div></details>`}
 if(nDel)h+=`<p style="margin:0 0 12px"><button class="btn ghost sm" id="undel">Restore ${nDel} deleted item(s)</button></p>`;
 h+=`<details class="card glance" open><summary>1 · Today at a Glance</summary><div class="in"><div>${(D.glance||[]).map(g=>itemRow(gKey(g,date),g.t,`<div class="tt">${chip(done(gKey(g,date))?'COMPLETED':g.s)}${esc(g.t)}</div>`,date)).join('')}${fromY?`<div class="task"><div>${chip('TODAY')}<b>From yesterday's notes:</b> ${esc(fromY)}</div></div>`:''}</div>${D.changed&&D.changed.length?`<h3>What changed since yesterday</h3><ul class="clean">${D.changed.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}</div></details>`;
 h+=`<details class="card" open><summary>2 · Today's Schedule</summary><div class="in">${D.schedule_note?`<p class="sub">${esc(D.schedule_note)}</p>`:''}${(D.schedule||[]).map(x=>itemRow(sKey(x,date),x.time+' '+x.title,`<div class="tt">${chip(done(sKey(x,date))?'COMPLETED':'')}<b>${esc(x.time)}</b> · ${esc(x.title)}</div><div class="tm">${[x.location,x.people,x.purpose].filter(Boolean).map(esc).join(' · ')}</div>${x.notes?`<div class="tm">${esc(x.notes)}</div>`:''}`,date)).join('')}${(D.upcoming||[]).length?`<h3>Coming up</h3><div>${D.upcoming.map(u=>itemRow(uKey(u),u.date+' '+u.t,`<div class="tt">${chip(done(uKey(u))?'COMPLETED':'')}<b>${esc(u.date)}</b> · ${esc(u.t)}</div>`,date)).join('')}</div>`:''}</div></details>`;
 h+=`<details class="card" open><summary>3 · Priority Action Items</summary><div class="in"><h3>Urgent — do today</h3>${(T.urgent||[]).map(t=>taskHtml(t,date)).join('')||'<p class="empty">Nothing urgent.</p>'}<h3>Important — this week</h3>${(T.week||[]).map(t=>taskHtml(t,date)).join('')}<h3>Follow up / waiting</h3>${(T.waiting||[]).map(t=>taskHtml(t,date)).join('')}</div></details>`;
 h+=`<details class="card"><summary>4 · Business / Project Updates</summary><div class="in">${projects(D,isToday)}</div></details>`;
 const E=D.email||{};h+=`<details class="card"><summary>5 · Email &amp; Communication</summary><div class="in">${emailGroup('Needs my reply',E.reply,date,1)}${emailGroup('Important information',E.info)}${emailGroup('Waiting for response',E.waiting)}${emailGroup('Can ignore / low priority',E.low)}${E.note?`<p class="sub" style="margin-top:12px">${esc(E.note)}</p>`:''}</div></details>`;
 const F=D.finance||{};h+=`<details class="card"><summary>6 · Financial Items</summary><div class="in"><table class="resp"><thead><tr><th>Type</th><th>Item</th><th>When / amount</th><th>Status</th></tr></thead><tbody>${finRows('Needs attention',F.risk)}${finRows('Past due',F.overdue)}${finRows('Needs approval',F.approval)}${finRows('Payment due',F.due)}${finRows('Expected in',F.expected)}${finRows('Deadline',F.deadlines)}</tbody></table></div></details>`;
 h+=`<details class="card"><summary>7 · Follow-ups</summary><div class="in"><table class="resp"><thead><tr><th>Person / company</th><th>Subject</th><th>Last contact</th><th>Waiting for</th><th>Next follow-up</th><th>Status</th></tr></thead><tbody>${(D.followups||[]).map(f=>`<tr><td data-l="Who"><b>${esc(f.who)}</b></td><td data-l="Subject">${esc(f.subject)}</td><td data-l="Last contact">${esc(f.last)}</td><td data-l="Waiting for">${esc(f.waiting)}</td><td data-l="Next">${esc(f.next)}</td><td data-l="Status">${chip(f.status)}</td></tr>`).join('')}</tbody></table></div></details>`;
 const ro=isToday?'':'readonly';h+=`<details class="card" ${isToday?'open':''}><summary>8 · Notes</summary><div class="in"><div class="notes">${[['quick','Quick Notes'],['ideas','Ideas'],['remember','Things to Remember'],['tomorrow','Add to Tomorrow']].map(([k,l])=>`<div><label>${l}</label><textarea data-note="${k}" ${ro} placeholder="${isToday?'Type here. It saves automatically.':''}">${esc(notes[k]||'')}</textarea></div>`).join('')}</div><p class="sub" style="margin-top:8px">Notes save on this device. Anything in "Add to Tomorrow" shows up at the top of tomorrow's briefing.</p></div></details>`;
 const C=D.cards||{};if(Object.keys(C).length)h+=`<h3 style="margin-top:26px">From your assistants</h3>`+Object.entries(C).map(([k,v])=>`<details class="card"><summary>${esc(k)}</summary><div class="in"><pre class="md">${esc(v.replace(/^# .*\n/,''))}</pre></div></details>`).join('');
 const sy=window.scrollY;$('#main').innerHTML=h;window.scrollTo(0,keepScroll?sy:0);keepScroll=false;
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{focusF=focusF&&focusF.k===b.dataset.f?null:{k:b.dataset.f,date};keepScroll=true;day(date)});
 const fc=$('#fclose');if(fc)fc.onclick=e=>{e.preventDefault();focusF=null;keepScroll=true;day(date)};
 document.querySelectorAll('.task .dbtn').forEach(c=>c.onclick=()=>{setDone(c.dataset.id,c.dataset.v==='1',c.dataset.date);keepScroll=true;day(date)});
 const q=(a,v)=>document.querySelector(`[${a}="${CSS.escape(v)}"]`);
 document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this task? It will be hidden from your briefing on this device.'))return;const m=LS.get('deleted',{});m[b.dataset.tdel]=date;LS.set('deleted',m);day(date)});
 document.querySelectorAll('[data-trep]').forEach(b=>b.onclick=()=>{const x=q('data-repbox',b.dataset.trep);x.hidden=!x.hidden;if(!x.hidden)x.querySelector('textarea').focus()});
 document.querySelectorAll('[data-tcancel]').forEach(b=>b.onclick=()=>{q('data-repbox',b.dataset.tcancel).hidden=true});
 const saveRep=(b,send)=>{const id=b.dataset.tsave||b.dataset.tsend,txt=q('data-reptext',id).value.trim();const m=LS.get('replies',{});
  if(!txt){delete m[id];LS.set('replies',m);day(date);return}
  m[id]={text:txt,date:b.dataset.date,sent:send||(m[id]&&m[id].sent&&m[id].text===txt)};LS.set('replies',m);
  if(send){const sub='Briefing reply: '+b.dataset.task,body=txt+'\n\n---\nTask: '+b.dataset.task+'\nTask ID: '+id+'\nBriefing date: '+b.dataset.date;
   location.href='mailto:texastadka50@gmail.com?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body)}
  setTimeout(()=>day(date),send?600:0)};
 document.querySelectorAll('[data-tsave]').forEach(b=>b.onclick=()=>saveRep(b,false));
 document.querySelectorAll('[data-tsend]').forEach(b=>b.onclick=()=>saveRep(b,true));
 const ud=$('#undel');if(ud)ud.onclick=()=>{const m=LS.get('deleted',{});keys.forEach(k=>delete m[k]);LS.set('deleted',m);day(date)};
 document.querySelectorAll('textarea[data-note]').forEach(t=>t.oninput=()=>{const n=LS.get('notes_'+date,{});n[t.dataset.note]=t.value;LS.set('notes_'+date,n)});
 const names=()=>LS.get('projects',null)||[...CFG.projects];
 document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=e=>{e.preventDefault();const n=names(),i=+b.dataset.ren,v=prompt('Rename project',n[i]);if(v){n[i]=v;LS.set('projects',n);day(date)}});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.preventDefault();const n=names(),i=+b.dataset.del;if(confirm('Remove "'+n[i]+'" from your project list?')){n.splice(i,1);LS.set('projects',n);day(date)}});
 const ap=$('#addp');if(ap)ap.onclick=()=>{const v=prompt('New project name');if(v){const n=names();n.push(v);LS.set('projects',n);day(date)}}}
let calM=null;
function cal(){const L=latest();if(!calM)calM=L.slice(0,7);const [y,m]=calM.split('-').map(Number);const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();
 let h=`<h2 class="day" style="display:flex;justify-content:space-between;align-items:center"><button class="btn ghost sm" id="pm">‹ Prev</button>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}<button class="btn ghost sm" id="nm">Next ›</button></h2><div class="cal">`+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="h">${d}</div>`).join('')+'<div style="visibility:hidden"></div>'.repeat(first.getDay());
 for(let d=1;d<=days;d++){const k=`${calM}-${String(d).padStart(2,'0')}`;h+=DB[k]?`<div class="has ${k===L?'sel':''}" data-d="${k}">${d}<small>Briefing</small></div>`:`<div>${d}</div>`}
 $('#main').innerHTML=h+'</div>';document.querySelectorAll('.cal .has').forEach(c=>c.onclick=()=>location.hash='day/'+c.dataset.d);
 const sh=n=>{const dt=new Date(y,m-1+n,1);calM=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');cal()};$('#pm').onclick=()=>sh(-1);$('#nm').onclick=()=>sh(1)}
function arch(){const by={};[...dates].reverse().forEach(d=>{const k=new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});(by[k]=by[k]||[]).push(d)});
 $('#main').innerHTML='<h2 class="day">Archive</h2><p class="sub">Every briefing is kept. Click a date to open it.</p>'+Object.entries(by).map(([k,v])=>`<div class="card"><div class="in" style="padding-top:14px"><h3 style="margin-top:0">${k}</h3><ul class="clean">${v.map(d=>`<li><a href="#day/${d}" style="color:var(--acc);font-weight:600;text-decoration:none">${new Date(d+'T12:00:00').getDate()} — Daily Briefing</a> <span class="tm">${fmtW(d)}</span></li>`).join('')}</ul></div></div>`).join('')}
function search(){$('#main').innerHTML='<h2 class="day">Search</h2><p class="sub">Search every briefing by person, company, project, keyword, or date (for example a name, a company, or "Sep 27").</p><div class="search"><input id="q" placeholder="Search briefings…" autofocus></div><div id="res"></div>';
 const idx=dates.map(d=>({d,txt:(fmt(d)+' '+fmtW(d)+' '+d+' '+JSON.stringify(DB[d])).replace(/[{}\[\]"]/g,' ')}));
 $('#q').oninput=()=>{const q=$('#q').value.trim().toLowerCase();if(q.length<2){$('#res').innerHTML='';return}
  const hits=idx.filter(x=>x.txt.toLowerCase().includes(q)).reverse();
  $('#res').innerHTML=hits.length?hits.map(x=>{const i=x.txt.toLowerCase().indexOf(q),s=x.txt.slice(Math.max(0,i-70),i+q.length+90);return `<div class="hit" data-d="${x.d}"><b>Daily Briefing — ${fmt(x.d)}</b><div class="tm">…${esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=>`<mark>${m}</mark>`)}…</div></div>`}).join(''):'<p class="empty">No matches.</p>';
  document.querySelectorAll('.hit').forEach(h=>h.onclick=()=>location.hash='day/'+h.dataset.d)}}
start();
</script></body></html>
